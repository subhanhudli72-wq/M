<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M.H.Hudli Jewellery</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
font-family:Poppins;
margin:0;
background:#f6f6f6;
}

header{
background:white;
padding:15px;
text-align:center;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

header h1{
margin:0;
}

header p{
margin:4px;
color:#666;
}

.filters{
display:flex;
gap:10px;
padding:10px;
overflow-x:auto;
}

.filters button{
border:none;
padding:8px 15px;
border-radius:20px;
background:#ddd;
cursor:pointer;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:12px;
padding:12px;
}

.product{
background:white;
border-radius:10px;
padding:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.product img{
width:100%;
height:150px;
object-fit:cover;
border-radius:8px;
}

.product h3{
font-size:14px;
margin:6px 0;
}

.product span{
font-weight:bold;
}

.product button{
background:#0d6efd;
color:white;
border:none;
padding:8px;
width:100%;
border-radius:6px;
cursor:pointer;
}

.cartBtn{
position:fixed;
bottom:20px;
right:20px;
background:#0d6efd;
color:white;
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
cursor:pointer;
}

.cartCount{
position:absolute;
top:-4px;
right:-4px;
background:red;
color:white;
font-size:12px;
padding:2px 6px;
border-radius:50%;
}

.cart{
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
display:none;
justify-content:center;
align-items:flex-end;
}

.cartBox{
background:white;
width:100%;
max-height:85%;
border-radius:20px 20px 0 0;
padding:15px;
overflow:auto;
}

.cartItem{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

.qty button{
margin:0 4px;
}

.total{
font-weight:bold;
margin-top:10px;
}

form input,form textarea{
width:100%;
padding:8px;
margin:6px 0;
}

.checkout{
background:#0d6efd;
color:white;
border:none;
padding:10px;
width:100%;
border-radius:8px;
}

.whatsapp{
position:fixed;
left:20px;
bottom:20px;
background:#25D366;
color:white;
padding:12px 16px;
border-radius:30px;
text-decoration:none;
}

</style>
</head>

<body>

<header>

<h1>M.H.Hudli</h1>
<p>Pure and elegant jewellery at factory price</p>
<p>Kolhapur MH | 📞 9309031070</p>

</header>

<div class="filters">

<button onclick="filter('all')">All</button>
<button onclick="filter('Jewellery')">Jewellery</button>
<button onclick="filter('Gemstone')">Gemstone</button>

</div>

<div class="products" id="products"></div>

<div class="cartBtn" onclick="toggleCart()">

🛒
<span class="cartCount" id="count">0</span>

</div>

<div class="cart" id="cart">

<div class="cartBox">

<h3>Your Cart</h3>

<div id="cartItems"></div>

<div class="total" id="total"></div>

<form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">

<input name="name" placeholder="Customer Name" required>

<input name="phone" placeholder="Phone Number" required>

<textarea name="address" placeholder="Delivery Address" required></textarea>

<textarea name="notes" placeholder="Special Instructions"></textarea>

<input type="hidden" name="order" id="orderField">

<button class="checkout">Place Order</button>

</form>

</div>

</div>

<a class="whatsapp" href="https://wa.me/919309031070" target="_blank">

Chat on WhatsApp

</a>

<script>

const products=[

{
name:"Gold Necklace",
price:45000,
cat:"Jewellery",
img:"https://images.unsplash.com/photo-1602173574767-37ac01994b2a",
desc:"Elegant gold necklace"
},

{
name:"Diamond Ring",
price:32000,
cat:"Jewellery",
img:"https://truediamond.in/cdn/shop/files/Solitaire_98.png?v=1767876365"
desc:"Certified diamond ring"
},

{
name:"Gold Bangles",
price:52000,
cat:"Jewellery",
img:"https://images.unsplash.com/photo-1611652022419-a9419f74343d",
desc:"Traditional bangles"
},

{
name:"Pearl Necklace",
price:21000,
cat:"Jewellery",
img:"https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f",
desc:"Premium pearl necklace"
},

{
name:"Ruby Gemstone",
price:15000,
cat:"Gemstone",
img:"https://images.unsplash.com/photo-1610116306796-6fea9f4fae38",
desc:"Natural ruby stone"
},

{
name:"Emerald Stone",
price:18000,
cat:"Gemstone",
img:"https://images.unsplash.com/photo-1588449668365-d15e397f6787",
desc:"Premium emerald"
},

{
name:"Blue Sapphire",
price:25000,
cat:"Gemstone",
img:"https://images.unsplash.com/photo-1598532394205-2d5b2b3a7a42",
desc:"Astrology sapphire"
},

{
name:"Opal Stone",
price:12000,
cat:"Gemstone",
img:"https://images.unsplash.com/photo-1605106702842-01a887a31122",
desc:"Natural opal gemstone"
},

{
name:"Gold Earrings",
price:18000,
cat:"Jewellery",
img:"https://images.unsplash.com/photo-1588449668365-d15e397f6787",
desc:"Lightweight gold earrings"
},

{
name:"Navratna Ring",
price:28000,
cat:"Jewellery",
img:"https://images.unsplash.com/photo-1515562141207-7a88fb7ce338",
desc:"Traditional navratna ring"
}

]

let cart=JSON.parse(localStorage.getItem("cart"))||[]

function showProducts(list){

document.getElementById("products").innerHTML=list.map((p,i)=>`

<div class="product">

<img src="${p.img}" loading="lazy" alt="${p.name}">

<h3>${p.name}</h3>

<p>${p.desc}</p>

<span>₹${p.price}</span>

<button onclick="add(${i})">Add to Cart</button>

</div>

`).join("")

}

function filter(cat){

if(cat==="all")showProducts(products)

else showProducts(products.filter(p=>p.cat===cat))

}

function add(i){

let item=cart.find(x=>x.name===products[i].name)

if(item)item.qty++

else cart.push({...products[i],qty:1})

save()

}

function save(){

localStorage.setItem("cart",JSON.stringify(cart))

update()

}

function update(){

document.getElementById("count").innerText=cart.reduce((a,b)=>a+b.qty,0)

let total=0

document.getElementById("cartItems").innerHTML=cart.map((c,i)=>{

total+=c.price*c.qty

return`

<div class="cartItem">

${c.name} x ${c.qty} - ₹${c.price*c.qty}

<div class="qty">

<button onclick="qty(${i},-1)">-</button>

<button onclick="qty(${i},1)">+</button>

<button onclick="removeItem(${i})">x</button>

</div>

</div>

`

}).join("")

document.getElementById("total").innerText="Total ₹"+total

document.getElementById("orderField").value=cart.map(c=>`${c.name} x${c.qty} ₹${c.price*c.qty}`).join("\n")+" Total ₹"+total

}

function qty(i,n){

cart[i].qty+=n

if(cart[i].qty<=0)cart.splice(i,1)

save()

}

function removeItem(i){

cart.splice(i,1)

save()

}

function toggleCart(){

let c=document.getElementById("cart")

c.style.display=c.style.display==="flex"?"none":"flex"

}

showProducts(products)

update()

</script>

</body>
  </html>
